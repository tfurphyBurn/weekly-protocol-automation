name: Update Weekly Protocol

on:
  schedule:
    # Runs Sundays at 06:17 UTC:
    # 2:17 AM EDT or 1:17 AM EST.
    - cron: "17 6 * * 0"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-protocol-update
  cancel-in-progress: false

jobs:
  update-protocol:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest protocol
        shell: bash
        run: |
          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --output weekly-protocol-new.jpeg \
            "https://burnbootcamp.widen.net/content/jkjvgcxsin/jpeg/Screencloud%20Protocol.jpeg?position=c&color=ffffffff&quality=80&u=nby9s5"

      - name: Validate downloaded image
        shell: bash
        run: |
          FILE_TYPE=$(file --brief --mime-type weekly-protocol-new.jpeg)
          FILE_SIZE=$(stat --format=%s weekly-protocol-new.jpeg)

          echo "Downloaded file type: $FILE_TYPE"
          echo "Downloaded file size: $FILE_SIZE bytes"

          if [[ "$FILE_TYPE" != image/* ]]; then
            echo "The downloaded file is not an image."
            exit 1
          fi

          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "The downloaded image is unexpectedly small."
            exit 1
          fi

      - name: Replace protocol image
        run: mv weekly-protocol-new.jpeg weekly-protocol.jpeg

      - name: Commit updated image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly-protocol.jpeg

          if git diff --cached --quiet; then
            echo "The downloaded protocol matches the existing image."
          else
            git commit -m "Update weekly protocol image"
            git push
          fi
