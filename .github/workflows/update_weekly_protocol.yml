name: Test Native OptiSigns Upload

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download current protocol image
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            --user-agent "Mozilla/5.0 WeeklyProtocolAutomation/1.0" \
            "https://burnbootcamp.widen.net/content/jkjvgcxsin/jpeg/Screencloud%20Protocol.jpeg?position=c&color=ffffffff&quality=80&u=nby9s5" \
            --output weekly-protocol.jpeg

          test -s weekly-protocol.jpeg

          MIME_TYPE="$(file --brief --mime-type weekly-protocol.jpeg)"
          echo "Downloaded MIME type: ${MIME_TYPE}"

          if [[ "${MIME_TYPE}" != "image/jpeg" ]]; then
            echo "Expected a JPEG but received ${MIME_TYPE}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OptiSigns SDK
        run: npm install @optisigns/optisigns@1.0.2

      - name: Upload native image to OptiSigns
        env:
          OPTISIGNS_API_KEY: ${{ secrets.OPTISIGNS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > upload.cjs <<'EOF'
          const { OptiSigns } = require("@optisigns/optisigns");

          const token = process.env.OPTISIGNS_API_KEY;

          if (!token || token.trim() === "") {
            throw new Error("OPTISIGNS_API_KEY secret is missing");
          }

          const client = new OptiSigns({
            token
          });

          async function main() {
            try {
              const asset = await client.assets.uploadFileAsset(
                "./weekly-protocol.jpeg",
                "Weekly Protocol SDK Test",
                "1"
              );

              console.log("UPLOAD SUCCESSFUL");
              console.log("Asset ID:", asset?._id);
              console.log("Asset type:", asset?.type);
              console.log("File type:", asset?.fileType);
              console.log("Status:", asset?.status);
              console.log("Filename:", asset?.filename);
              console.log("Original filename:", asset?.originalFileName);
              console.log(JSON.stringify(asset, null, 2));

              if (!asset?._id) {
                throw new Error(
                  "OptiSigns did not return an asset ID"
                );
              }
            } catch (error) {
              console.error("UPLOAD FAILED");
              console.error("Message:", error?.message || error);

              if (error?.response?.status) {
                console.error(
                  "HTTP status:",
                  error.response.status
                );
              }

              if (error?.response?.errors) {
                console.error(
                  "GraphQL errors:",
                  JSON.stringify(error.response.errors, null, 2)
                );
              }

              if (error?.response?.data) {
                console.error(
                  "Response data:",
                  JSON.stringify(error.response.data, null, 2)
                );
              }

              console.error(error?.stack || error);
              process.exit(1);
            }
          }

          main();
          EOF

          node upload.cjs
