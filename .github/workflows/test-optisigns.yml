name: Test OptiSigns Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Query BA Desk TV playlist
        env:
          OPTISIGNS_API_KEY: ${{ secrets.OPTISIGNS_API_KEY }}
        run: |
          response=$(curl --silent --show-error --fail \
            --request POST \
            --url "https://graphql-gateway.optisigns.com/graphql" \
            --header "Authorization: Bearer $OPTISIGNS_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"query":"query { playlists(query: { name: \"BA Desk TV\" }) { page { edges { node { _id name assets { _id filename fileType duration } } } } } }"}')

          echo "$response" | python3 -m json.tool

          echo "$response" | grep -q '"P6REJNgRMwFxWiohi"'
          echo "$response" | grep -q '"BA Desk TV"'

          echo "OptiSigns connection successful."
