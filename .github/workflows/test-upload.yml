- name: Upload test image
  env:
    OPTISIGNS_API_KEY: ${{ secrets.OPTISIGNS_API_KEY }}
  run: |
    cat > upload.mjs <<'EOF'
    import { OptiSigns } from "@optisigns/optisigns";

    const token = process.env.OPTISIGNS_API_KEY;

    if (!token) {
      throw new Error("OPTISIGNS_API_KEY secret is missing");
    }

    const client = new OptiSigns({
      token
    });

    try {
      const asset = await client.assets.uploadFileAsset(
        "./test-image.png",
        "1"
      );

      console.log("UPLOAD SUCCESSFUL");
      console.log(JSON.stringify(asset, null, 2));
    } catch (error) {
      console.error("UPLOAD FAILED");
      console.error("Message:", error?.message);

      if (error?.response?.data) {
        console.error(
          "Response:",
          JSON.stringify(error.response.data, null, 2)
        );
      }

      if (error?.response?.status) {
        console.error("HTTP status:", error.response.status);
      }

      console.error(error);
      process.exit(1);
    }
    EOF

    node upload.mjs
