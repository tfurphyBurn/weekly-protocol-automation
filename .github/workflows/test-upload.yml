name: Test OptiSigns Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create test image
        run: |
          curl -L \
            "https://dummyimage.com/1280x720/222222/ffffff.png&text=OptiSigns+Upload+Test" \
            -o test-image.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDK
        run: npm install @optisigns/optisigns

      - name: Upload image
        env:
          OPTISIGNS_API_KEY: ${{ secrets.OPTISIGNS_API_KEY }}
        run: |
          cat > upload.mjs <<'EOF'
          import { OptiSigns } from "@optisigns/optisigns";

          const token = process.env.OPTISIGNS_API_KEY;

          console.log("Token exists:", !!token);

          const client = new OptiSigns({
            token
          });

          try {

            const asset = await client.assets.uploadFileAsset(
              "./test-image.png",
              "1"
            );

            console.log("SUCCESS");
            console.log(JSON.stringify(asset,null,2));

          } catch(err) {

            console.error(err);

            if(err.response){
              console.error(err.response.status);
              console.error(JSON.stringify(err.response.data,null,2));
            }

            process.exit(1);
          }

          EOF

          node upload.mjs
