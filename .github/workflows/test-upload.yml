name: Test OptiSigns Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Create test image
        run: |
          curl -L \
            "https://dummyimage.com/1280x720/222222/ffffff.png&text=OptiSigns+Upload+Test" \
            -o test-image.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OptiSigns SDK
        run: npm install @optisigns/optisigns

      - name: Upload test image
        env:
          OPTISIGNS_API_KEY: ${{ secrets.OPTISIGNS_API_KEY }}
        run: |
          cat > upload.mjs <<'EOF'
          import { OptiSigns } from "@optisigns/optisigns";

          const client = new OptiSigns(process.env.OPTISIGNS_API_KEY);

          try {
            const asset = await client.assets.uploadFileAsset(
              "./test-image.png",
              "1"
            );

            console.log("UPLOAD SUCCESSFUL");
            console.log(JSON.stringify(asset, null, 2));
          } catch (error) {
            console.error("UPLOAD FAILED");

            if (error?.response?.data) {
              console.error(JSON.stringify(error.response.data, null, 2));
            } else {
              console.error(error);
            }

            process.exit(1);
          }
          EOF

          node upload.mjs
